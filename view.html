<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Çekiliş - İnovel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .animate-in { animation: animateIn 0.5s ease-out forwards; opacity: 0; }
        @keyframes animateIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .slide-in-from-bottom-10 { animation: slideInBottom 0.7s ease-out forwards; opacity: 0; }
        @keyframes slideInBottom { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        .zoom-in { animation: zoomIn 0.3s ease-out forwards; opacity: 0; }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-[#0B1726] text-white overflow-hidden h-screen w-screen flex flex-col items-center justify-center font-sans">
    
    <div id="loading" class="flex flex-col items-center justify-center text-slate-500 p-4 text-center absolute inset-0 bg-[#0B1726] z-50">
        <img src="./assets/logo.png" class="w-24 h-24 md:w-32 md:h-32 opacity-20 mb-4 animate-pulse object-contain"/>
        <h1 class="text-xl md:text-2xl tracking-widest uppercase font-bold">Aktif Etkinlik Bekleniyor...</h1>
    </div>

    <div id="mainContent" class="relative h-full w-full flex flex-col items-center justify-center hidden">
        
        <!-- ARKA PLAN EFEKTLERİ -->
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute top-0 left-0 w-[300px] h-[300px] md:w-[800px] md:h-[800px] bg-blue-900/20 rounded-full blur-[80px] md:blur-[120px] -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 right-0 w-[300px] h-[300px] md:w-[800px] md:h-[800px] bg-purple-900/20 rounded-full blur-[80px] md:blur-[120px] translate-x-1/2 translate-y-1/2"></div>
        </div>

        <!-- ÜST BİLGİ BAR -->
        <div class="absolute top-4 md:top-8 w-full flex justify-between items-start px-4 md:px-12 z-20">
            <img src="./assets/logo.png" class="w-12 h-12 md:w-20 md:h-20 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]"/>
            
            <div class="text-right flex flex-col items-end">
                <h2 id="viewRaffleTitle" class="text-sm md:text-3xl font-bold tracking-tight text-slate-200 max-w-[200px] md:max-w-none truncate"></h2>
                <div class="inline-flex items-center gap-2 md:gap-3 bg-white/5 px-3 py-1 md:px-6 md:py-2 rounded-full mt-2 border border-white/10 backdrop-blur-md">
                    <span class="relative flex h-2 w-2 md:h-3 md:w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 md:h-3 md:w-3 bg-green-500"></span>
                    </span>
                    <span id="viewParticipantCount" class="text-sm md:text-xl font-mono font-bold text-blue-200">0</span>
                    <span class="text-[10px] md:text-xs text-slate-400 uppercase tracking-widest hidden sm:inline">Katılımcı</span>
                </div>
            </div>
        </div>

        <!-- MERKEZ SAHNE: ÇEKİLİŞ -->
        <div id="stageArea" class="relative z-10 flex flex-col items-center justify-center w-full max-w-6xl text-center px-4">
            <!-- İçerik JS ile doldurulacak -->
        </div>

        <!-- ALT BİLGİ -->
        <div class="absolute bottom-4 md:bottom-6 text-center opacity-30 text-[10px] md:text-sm tracking-[0.3em] md:tracking-[0.5em] uppercase w-full px-4">
            İnovel Medya ve Tasarım Ekibi
        </div>
    </div>

    <script type="module" src="./js/view.js"></script>
</body>
</html>
